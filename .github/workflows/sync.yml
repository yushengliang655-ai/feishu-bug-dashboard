name: Sync Feishu bug dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-feishu-bug-dashboard
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || (github.event.issue.title == '[sync-dashboard] 同步看板' && github.event.issue.state == 'open')
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Meegle CLI
        run: npm install --global @lark-project/meegle@latest
      - name: Read and update dashboard
        env:
          MEEGLE_HOST: project.feishu.cn
          MEEGLE_PROJECT_KEY: i9lz5k
          MEEGLE_WORK_ITEM_TYPE: issue
        run: node scripts/sync.mjs
      - name: Commit snapshot
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Sync Feishu bug dashboard"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
          }
      - name: Close sync request
        if: success() && github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: powershell
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $url = "https://api.github.com/repos/$env:REPOSITORY/issues/$env:ISSUE_NUMBER"
          Invoke-RestMethod -Method Patch -Uri $url -Headers $headers -Body (@{ state = "closed" } | ConvertTo-Json) -ContentType "application/json" | Out-Null
          Invoke-RestMethod -Method Post -Uri "$url/comments" -Headers $headers -Body (@{ body = "看板同步已完成，请刷新页面查看。" } | ConvertTo-Json) -ContentType "application/json" | Out-Null
