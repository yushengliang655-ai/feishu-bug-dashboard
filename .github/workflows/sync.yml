name: Sync Feishu bug dashboard

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-feishu-bug-dashboard
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.title == '[sync-dashboard] 同步看板' && github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Meegle CLI
        run: npm install --global @lark-project/meegle@latest
      - name: Read live bugs and update dashboard
        env:
          MEEGLE_HOST: project.feishu.cn
          MEEGLE_USER_ACCESS_TOKEN: ${{ secrets.MEEGLE_USER_ACCESS_TOKEN }}
          MEEGLE_PROJECT_KEY: i9lz5k
          MEEGLE_WORK_ITEM_TYPE: issue
        run: node scripts/sync.mjs
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- index.html; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Feishu bug dashboard"
          git push
      - name: Close sync request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Dashboard sync completed. Refresh the public board to see the latest snapshot."
